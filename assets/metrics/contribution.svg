        <rect x="224" y="238" width="36" height="4" rx="6" fill="url(#accent-gradient)" class="pulse" />
        <text class="muted mono" x="242" y="258" text-anchor="middle" font-size="10">Jun</text>
        <text class="text mono" x="242" y="232" text-anchor="middle" font-size="10">0</text>
      
        <rect class="bar-track" x="274" y="92" width="36" height="150" rx="6" />
        <rect x="274" y="238" width="36" height="4" rx="6" fill="url(#accent-gradient)" class="pulse" />
        <text class="muted mono" x="292" y="258" text-anchor="middle" font-size="10">Jul</text>
        <text class="text mono" x="292" y="232" text-anchor="middle" font-size="10">0</text>
      
        <rect class="bar-track" x="324" y="92" width="36" height="150" rx="6" />
        <rect x="324" y="238" width="36" height="4" rx="6" fill="url(#accent-gradient)" class="pulse" />
        <text class="muted mono" x="342" y="258" text-anchor="middle" font-size="10">Aug</text>
        <text class="text mono" x="342" y="232" text-anchor="middle" font-size="10">0</text>
      
        <rect class="bar-track" x="374" y="92" width="36" height="150" rx="6" />
        <rect x="374" y="238" width="36" height="4" rx="6" fill="url(#accent-gradient)" class="pulse" />
        <text class="muted mono" x="392" y="258" text-anchor="middle" font-size="10">Sep</text>
