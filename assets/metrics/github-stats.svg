<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="240" viewBox="0 0 680 240" role="img" aria-labelledby="title desc">
  <title id="title">GitHub profile metric</title>
  <desc id="desc">Automatically generated profile visual card.</desc>
  <defs>
    
  <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#58a6ff">
      <animate attributeName="stop-color" values="#58a6ff;#1f6feb;#58a6ff" dur="8s" repeatCount="indefinite"/>
    </stop>
    <stop offset="50%" stop-color="#1f6feb">
      <animate attributeName="stop-color" values="#1f6feb;#2ea043;#1f6feb" dur="8s" repeatCount="indefinite"/>
    </stop>
    <stop offset="100%" stop-color="#2ea043">
      <animate attributeName="stop-color" values="#2ea043;#58a6ff;#2ea043" dur="8s" repeatCount="indefinite"/>
    </stop>
  </linearGradient>

  </defs>
  
  <style>
    :root { color-scheme: dark; }
    .bg { fill: #0d1117; }
    .muted { fill: #8b949e; }
    .text { fill: #c9d1d9; }
    .heading { fill: #f0f6fc; font-weight: 600; }
    .accent { fill: #58a6ff; }
    .soft { fill: #21262d; }
    .bar-track { fill: #30363d; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .pulse { transform-origin: center; animation: pulse 4s ease-in-out infinite; }
    .slide { animation: slide 10s linear infinite; }
    .grow { animation: grow 1.2s ease-out; }
    @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
    @keyframes slide { 0% { transform: translateX(0); } 100% { transform: translateX(-160px); } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) {
      .pulse, .slide, .grow { animation: none !important; }
      animate { display: none; }
    }
  </style>

  
  <rect class="bg" x="0" y="0" width="680" height="240" rx="16" />
  <rect x="1" y="1" width="678" height="238" rx="15" fill="none" stroke="#30363d" />
  <text class="heading sans" x="24" y="36" font-size="20">GitHub Stats</text>
  <text class="muted sans" x="24" y="58" font-size="13">Live data generated from GitHub REST API</text>
  
    
      <text class="muted sans" x="24" y="90" font-size="12">Developer</text>
      <text class="text mono" x="24" y="116" font-size="22">@trungtruc59</text>
    
      <text class="muted sans" x="304" y="90" font-size="12">Public repositories</text>
      <text class="text mono" x="304" y="116" font-size="22">0</text>
    
      <text class="muted sans" x="24" y="150" font-size="12">Followers</text>
      <text class="text mono" x="24" y="176" font-size="22">0</text>
    
      <text class="muted sans" x="304" y="150" font-size="12">Total stars</text>
      <text class="text mono" x="304" y="176" font-size="22">0</text>
    
      <text class="muted sans" x="24" y="210" font-size="12">Total forks</text>
      <text class="text mono" x="24" y="236" font-size="22">0</text>
    
      <text class="muted sans" x="304" y="210" font-size="12">Following</text>
      <text class="text mono" x="304" y="236" font-size="22">0</text>
    
    
    <circle cx="530" cy="112" r="32" fill="none" stroke="#30363d" stroke-width="7" />
    <circle cx="530" cy="112" r="32" fill="none" stroke="#2ea043" stroke-width="7" stroke-linecap="round"
      stroke-dasharray="201.06" stroke-dashoffset="201.06" transform="rotate(-90 530 112)" class="pulse" />
    <text class="text mono" x="530" y="116" text-anchor="middle" font-size="13">0%</text>
    <text class="muted sans" x="530" y="164" text-anchor="middle" font-size="11">Recent activity</text>
  
    
    <circle cx="620" cy="112" r="32" fill="none" stroke="#30363d" stroke-width="7" />
    <circle cx="620" cy="112" r="32" fill="none" stroke="#58a6ff" stroke-width="7" stroke-linecap="round"
      stroke-dasharray="201.06" stroke-dashoffset="201.06" transform="rotate(-90 620 112)" class="pulse" />
    <text class="text mono" x="620" y="116" text-anchor="middle" font-size="13">0%</text>
    <text class="muted sans" x="620" y="164" text-anchor="middle" font-size="11">Star density</text>
  
  

</svg>