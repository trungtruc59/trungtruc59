<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">GitHub profile metric</title>
  <desc id="desc">Automatically generated profile visual card.</desc>
  <defs>
    
  <linearGradient id="header-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#58a6ff">
      <animate attributeName="stop-color" values="#58a6ff;#1f6feb;#58a6ff" dur="8s" repeatCount="indefinite"/>
    </stop>
    <stop offset="50%" stop-color="#1f6feb">
      <animate attributeName="stop-color" values="#1f6feb;#2ea043;#1f6feb" dur="8s" repeatCount="indefinite"/>
    </stop>
    <stop offset="100%" stop-color="#2ea043">
      <animate attributeName="stop-color" values="#2ea043;#58a6ff;#2ea043" dur="8s" repeatCount="indefinite"/>
    </stop>
  </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363d" stroke-width="1" opacity="0.6"/>
    </pattern>
  </defs>
  
  <style>
    :root { color-scheme: dark; }
    .bg { fill: #0d1117; }
    .muted { fill: #8b949e; }
    .text { fill: #c9d1d9; }
    .heading { fill: #f0f6fc; font-weight: 600; }
    .accent { fill: #58a6ff; }
    .soft { fill: #21262d; }
    .bar-track { fill: #30363d; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .pulse { transform-origin: center; animation: pulse 4s ease-in-out infinite; }
    .slide { animation: slide 10s linear infinite; }
    .grow { animation: grow 1.2s ease-out; }
    @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
    @keyframes slide { 0% { transform: translateX(0); } 100% { transform: translateX(-160px); } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) {
      .pulse, .slide, .grow { animation: none !important; }
      animate { display: none; }
    }
  </style>

  
    <rect class="bg" x="0" y="0" width="1200" height="320" rx="20" />
    <rect x="0" y="0" width="1200" height="320" fill="url(#grid)" opacity="0.45" />
    <rect x="0" y="0" width="1200" height="6" fill="url(#header-gradient)" class="slide" />
    <text class="heading sans" x="72" y="130" font-size="72" letter-spacing="2">FULL-STACK</text>
    <text class="heading sans" x="72" y="208" font-size="72" letter-spacing="2">ENGINEER</text>
    <text class="accent mono" x="72" y="258" font-size="24">BUILD · SHIP · SCALE</text>
    <g transform="translate(900 60)">
      <rect x="0" y="0" width="240" height="170" rx="14" class="soft" />
      <rect x="16" y="24" width="208" height="10" rx="5" fill="#58a6ff" opacity="0.75"/>
      <rect x="16" y="52" width="170" height="8" rx="4" fill="#2ea043" opacity="0.8"/>
      <rect x="16" y="74" width="190" height="8" rx="4" fill="#58a6ff" opacity="0.6"/>
      <rect x="16" y="96" width="130" height="8" rx="4" fill="#d29922" opacity="0.8"/>
      <circle cx="24" cy="148" r="6" fill="#2ea043" class="pulse"/>
      <text class="muted mono" x="38" y="152" font-size="12">deploy --production</text>
    </g>
  
</svg>