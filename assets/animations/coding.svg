<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="180" viewBox="0 0 680 180" role="img" aria-labelledby="title desc">
  <title id="title">GitHub profile metric</title>
  <desc id="desc">Automatically generated profile visual card.</desc>
  <defs>
    
  <linearGradient id="coding-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#58a6ff">
      <animate attributeName="stop-color" values="#58a6ff;#2ea043;#58a6ff" dur="8s" repeatCount="indefinite"/>
    </stop>
    <stop offset="50%" stop-color="#2ea043">
      <animate attributeName="stop-color" values="#2ea043;#58a6ff;#2ea043" dur="8s" repeatCount="indefinite"/>
    </stop>
    <stop offset="100%" stop-color="#58a6ff">
      <animate attributeName="stop-color" values="#58a6ff;#58a6ff;#58a6ff" dur="8s" repeatCount="indefinite"/>
    </stop>
  </linearGradient>

  </defs>
  
  <style>
    :root { color-scheme: dark; }
    .bg { fill: #0d1117; }
    .muted { fill: #8b949e; }
    .text { fill: #c9d1d9; }
    .heading { fill: #f0f6fc; font-weight: 600; }
    .accent { fill: #58a6ff; }
    .soft { fill: #21262d; }
    .bar-track { fill: #30363d; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .pulse { transform-origin: center; animation: pulse 4s ease-in-out infinite; }
    .slide { animation: slide 10s linear infinite; }
    .grow { animation: grow 1.2s ease-out; }
    @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
    @keyframes slide { 0% { transform: translateX(0); } 100% { transform: translateX(-160px); } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) {
      .pulse, .slide, .grow { animation: none !important; }
      animate { display: none; }
    }
  </style>

  
  <rect class="bg" x="0" y="0" width="680" height="180" rx="16" />
  <rect x="1" y="1" width="678" height="178" rx="15" fill="none" stroke="#30363d" />
  <text class="heading sans" x="24" y="36" font-size="20">Coding Flow</text>
  <text class="muted sans" x="24" y="58" font-size="13">Lightweight SVG animation</text>
  
      <rect x="24" y="78" width="632" height="72" rx="10" class="soft" />
      <text class="mono text" x="44" y="106" font-size="14">const ship = async () =&gt; {'{'}</text>
      <text class="mono text" x="44" y="128" font-size="14">  await pipeline(test, build, deploy);</text>
      <text class="mono text" x="44" y="150" font-size="14">{'}'};</text>
      <rect x="352" y="137" width="10" height="16" fill="url(#coding-gradient)" class="pulse" />
    

</svg>